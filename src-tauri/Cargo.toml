[package]
name = "moss"
version = "0.1.0"
description = "A local-first calling helper with reliable realtime guidance."
authors = ["MOSS"]
license = "GPL-3.0"
repository = ""
homepage = ""
documentation = ""
readme = "../README.md"
keywords = ["ai-assistant", "tauri", "desktop-app", "privacy-first", "calling-helper"]
categories = ["gui", "multimedia", "accessibility", "science", "development-tools"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "moss_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.4.0", features = [] }

[dependencies]
tauri = { version = "=2.8.2", features = [] }
tauri-plugin-http = "2.5.2"
tauri-plugin-keychain = "2.0"
tauri-plugin-global-shortcut = "=2.3.0"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
cpal = "0.15.3"
hound = "3.5.1"
tokio = { version = "1.0", features = ["full"] }
once_cell = "1.19.0"
uuid = { version = "1.0", features = ["v4"] }
zip = { version = "6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.38.1"
lopdf = "0.42.0"
futures-util = "0.3"
anyhow = "1.0"
tracing = "0.1"
ringbuf = "0.4.8"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-macos-permissions = "2"
cidre = "0.11.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["std", "NSApplication", "NSImage"], default-features = false }
objc2-foundation = { version = "0.3", features = ["std", "NSData", "NSThread"], default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.19.0"

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.30.1"
libpulse-simple-binding = "2.29.0"

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3
